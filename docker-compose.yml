services:
  mirror:
    build: .
    image: scalewithus/linux-mirror:latest
    container_name: linux-mirror
    restart: unless-stopped
    env_file:
      - .env
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.scalewithus.com}
      S3_BUCKET: ${S3_BUCKET:-linux-mirrors}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ADDRESSING: ${S3_ADDRESSING:-path}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METADATA_CACHE_SECONDS: ${METADATA_CACHE_SECONDS:-21600}
      PACKAGE_CACHE_SECONDS: ${PACKAGE_CACHE_SECONDS:-15552000}
      NEGATIVE_CACHE_SECONDS: ${NEGATIVE_CACHE_SECONDS:-60}
      MAX_SPOOL_BYTES: ${MAX_SPOOL_BYTES:-2147483648}
      MAX_CONCURRENT_SPOOLS: ${MAX_CONCURRENT_SPOOLS:-3}
      MIN_TMP_FREE_BYTES: ${MIN_TMP_FREE_BYTES:-536870912}
      S3_QUOTA_BYTES: ${S3_QUOTA_BYTES:-}
      METRICS_STATE_PATH: ${METRICS_STATE_PATH:-/var/lib/linux-mirror/metrics.json}
      METRICS_FLUSH_SECONDS: ${METRICS_FLUSH_SECONDS:-10}
      LOCAL_CACHE_DIR: /app/data/cache
      LOCAL_CACHE_RESERVE_BYTES: ${LOCAL_CACHE_RESERVE_BYTES:-16106127360}
      LOCAL_CACHE_BYTES: ${LOCAL_CACHE_BYTES:-}
    # Only reachable on the compose network; Caddy publishes 80/443
    expose:
      - "8080"
    volumes:
      - mirror_data:/var/lib/linux-mirror
      - ./data/cache:/app/data/cache
    tmpfs:
      - /tmp:size=8g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: linux-mirror-caddy
    restart: unless-stopped
    depends_on:
      mirror:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@scalewithus.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  mirror_data:
  caddy_data:
  caddy_config:
