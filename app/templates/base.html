<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} · ScaleWithUs Mirror</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg0: "#0c1210",
            bg1: "#14201a",
            ink: "#e8f0ea",
            muted: "#8fa396",
            accent: "#3dd68c",
            "accent-dim": "#1f6b4a",
            line: "#24332c",
            code: "#0a0f0d",
            warn: "#e6b35c",
            danger: "#e86a6a",
          },
          fontFamily: {
            display: ['"Fraunces"', "Georgia", "serif"],
            body: ['"Sora"', "system-ui", "sans-serif"],
            mono: ['"IBM Plex Mono"', "ui-monospace", "monospace"],
          },
          boxShadow: {
            glow: "0 0 80px rgba(61, 214, 140, 0.08)",
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/static/css/site.css" />
  {% block head %}{% endblock %}
</head>
<body class="min-h-full font-body text-ink antialiased bg-bg0">
  <div class="pointer-events-none fixed inset-0 -z-10 bg-[radial-gradient(1200px_600px_at_10%_-10%,#1a3d2e_0%,transparent_55%),radial-gradient(900px_500px_at_100%_0%,#163028_0%,transparent_50%),linear-gradient(165deg,#0c1210,#14201a_45%,#0e1612)]"></div>
  <div class="{% if wide %}mx-auto w-[min(1080px,calc(100%-2.5rem))]{% else %}mx-auto w-[min(920px,calc(100%-2.5rem))]{% endif %}">
    <header class="flex flex-wrap items-baseline justify-between gap-4 border-b border-line pb-2 pt-6">
      <a href="/" class="font-display text-lg font-semibold tracking-tight text-ink no-underline hover:text-accent">
        ScaleWith<span class="text-accent">Us</span> Mirror
      </a>
      <nav class="flex gap-4 text-sm">
        <a href="/" class="no-underline {% if active == 'home' %}text-ink{% else %}text-muted hover:text-ink{% endif %}">Home</a>
        <a href="/guides" class="no-underline {% if active == 'guides' %}text-ink{% else %}text-muted hover:text-ink{% endif %}">Guides</a>
        <a href="/metrics" class="no-underline {% if active == 'metrics' %}text-ink{% else %}text-muted hover:text-ink{% endif %}">Metrics</a>
        <a href="/healthz" class="text-muted no-underline hover:text-ink">Health</a>
      </nav>
    </header>

    {% block content %}{% endblock %}

    <footer class="mt-8 border-t border-line py-5 text-sm text-muted">
      On-demand S3 cache ·
      <a class="text-accent underline-offset-2 hover:text-[#7dffc0]" href="https://mirror.scalewithus.com">mirror.scalewithus.com</a>
    </footer>
  </div>
  <script src="/static/js/site.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
