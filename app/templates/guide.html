{% extends "base.html" %}
{% block head %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/bash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/ini.min.js"></script>
{% endblock %}
{% block content %}
<article class="animate-rise py-8 pb-14">
  <div class="mb-4 text-sm text-muted">
    <a href="/guides" class="text-accent no-underline hover:text-[#7dffc0]">Guides</a>
    <span> / {{ guide.title }}</span>
  </div>
  <div class="guide-md prose prose-invert max-w-3xl prose-headings:font-display prose-a:text-accent prose-code:font-mono prose-pre:bg-code prose-pre:border prose-pre:border-line">
    {{ body_html | safe }}
  </div>
</article>
{% endblock %}
{% block scripts %}
<script>
  if (window.hljs) {
    document.querySelectorAll("pre code").forEach(function (el) {
      hljs.highlightElement(el);
    });
  }
</script>
{% endblock %}
