{% extends "base.html" %}
{% block content %}
<section class="animate-rise py-12 pb-6">
  <h1 class="font-display text-[clamp(2rem,4vw,2.8rem)] font-medium tracking-tight">Setup guides</h1>
  <p class="mt-3 max-w-xl text-muted">
    Cloud-init for first boot, or switch an existing server with the universal installer. Each OS guide covers both.
  </p>
</section>
<section class="animate-rise pb-12">
  <div class="grid grid-cols-[repeat(auto-fill,minmax(15rem,1fr))] gap-3">
    {% for g in guides %}
    <a href="/guides/{{ g.slug }}" class="block rounded-lg border border-line bg-[rgba(8,14,11,0.55)] px-4 py-4 text-inherit no-underline transition hover:-translate-y-0.5 hover:border-accent-dim">
      <strong class="mb-1 block text-ink">{{ g.title }}</strong>
      <span class="text-sm text-muted">{{ g.blurb }}</span>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
